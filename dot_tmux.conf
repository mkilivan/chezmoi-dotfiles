set -g prefix C-a

set -g mouse on

# let panes (incl. over ssh) set the system clipboard via OSC 52
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Act like vim in copy mode
set -g status-keys vi
setw -g mode-keys vi

# macOS: copy mouse selections and copy-mode yanks straight to the system clipboard
if-shell 'uname | grep -q Darwin' {
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
}

# Reload tmux.conf with prefix-r
bind C-r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Plugin manager (tpm) — install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Catppuccin theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Show window name (#W) in tabs instead of pane title (#T), which
# defaults to the hostname until a program explicitly sets it
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# tmux-prefix-highlight — flashes an indicator in the status bar while
# the C-a prefix chord is active (and during copy-mode)
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_fg '#{@thm_crust}'
set -g @prefix_highlight_bg '#{@thm_yellow}'
set -g @prefix_highlight_copy_mode_attr 'fg=#{@thm_crust},bg=#{@thm_flamingo}'

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{prefix_highlight}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
